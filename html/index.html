<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIBLE TOUR — 코너활동 진행 가이드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    background: linear-gradient(135deg, #1a3a6b 0%, #0d2447 50%, #1a3a6b 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stars {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(2px 2px at 45% 70%, rgba(255,220,100,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,0.3) 0%, transparent 100%);
  }
  .main-title {
    text-align: center;
    margin-bottom: 60px;
    position: relative;
    z-index: 1;
  }
  .main-title .year { color: #ffd700; font-size: 1.4rem; font-weight: 600; letter-spacing: 0.2em; margin-bottom: 8px; }
  .main-title h1 {
    font-size: 4rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    letter-spacing: 0.05em;
  }
  .main-title h1 span { color: #ffd700; }
  .main-title .subtitle { color: #a8c4e8; font-size: 1.3rem; margin-top: 10px; }
  .tour-grid {
    display: flex;
    gap: 32px;
    position: relative;
    z-index: 1;
  }
  .tour-card {
    width: 280px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 40px 28px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tour-card:hover {
    transform: translateY(-8px);
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .tour-card .icon {
    font-size: 4rem;
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }
  .tour-card .tour-name {
    font-size: 2rem;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .tour-card .tour-desc {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .tour-card .tour-count {
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 0.9rem;
    color: #ffd700;
    font-weight: 700;
  }
  .card-mission { border-top: 4px solid #4CAF50; }
  .card-action  { border-top: 4px solid #f44336; }
  .card-food    { border-top: 4px solid #FF9800; }
  .card-mission:hover { box-shadow: 0 20px 60px rgba(76,175,80,0.3); }
  .card-action:hover  { box-shadow: 0 20px 60px rgba(244,67,54,0.3); }
  .card-food:hover    { box-shadow: 0 20px 60px rgba(255,152,0,0.3); }
  .footer { position: fixed; bottom: 24px; color: rgba(255,255,255,0.4); font-size: 0.85rem; z-index: 1; }
</style>
</head>
<body>
<div class="stars"></div>

<div class="main-title">
  <div class="year">2026 성경학교</div>
  <h1>BIBLE <span>TOUR</span></h1>
  <div class="subtitle">코너활동 진행 가이드 — 예수님은 누구신가?</div>
</div>

<div class="tour-grid">
  <a class="tour-card card-mission" href="mission-tour.html">
    <div class="icon">🎨</div>
    <div class="tour-name">미션투어</div>
    <div class="tour-desc">말씀을 손으로 직접 체험하는<br>만들기 활동</div>
    <div class="tour-count">3가지 만들기</div>
  </a>
  <a class="tour-card card-action" href="action-tour.html">
    <div class="icon">🎮</div>
    <div class="tour-name">액션투어</div>
    <div class="tour-desc">예수님의 기적을 몸으로 체험하는<br>신체 협동 게임</div>
    <div class="tour-count">4가지 게임</div>
  </a>
  <a class="tour-card card-food" href="food-tour.html">
    <div class="icon">🍽️</div>
    <div class="tour-name">미식투어</div>
    <div class="tour-desc">성경 이야기와 함께하는<br>먹거리 만들기 활동</div>
    <div class="tour-count">3가지 먹거리</div>
  </a>
</div>

<div class="footer">대한기독교 나사렛성결회 교육국 · 2026</div>
</body>
</html>
