<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미식투어 — BIBLE TOUR 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    background: #1a0f00;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .top-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 32px;
    background: rgba(0,0,0,0.5);
    border-bottom: 1px solid rgba(255,152,0,0.2);
    flex-shrink: 0;
  }
  .nav-home { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; }
  .nav-home:hover { color: #fff; }
  .nav-title { font-size: 1.1rem; font-weight: 700; color: #FF9800; letter-spacing: 0.1em; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; cursor: pointer; }
  .dot.active { background: #FF9800; }
  .dot.done { background: rgba(255,152,0,0.4); }
  .slide-counter { font-size: 0.85rem; color: rgba(255,255,255,0.5); min-width: 60px; text-align: right; }
  .slide-area { flex: 1; position: relative; overflow: hidden; }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateX(80px);
    transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
  }
  .slide.active { opacity: 1; transform: translateX(0); pointer-events: all; }
  .slide.prev { opacity: 0; transform: translateX(-80px); }

  /* COVER */
  .s-cover {
    flex-direction: column; text-align: center;
    background: radial-gradient(ellipse at center, #4a2000 0%, #1a0900 70%);
    padding: 40px;
  }
  .cover-badge {
    background: #FF9800; color: #000; font-size: 1rem; font-weight: 900;
    padding: 8px 28px; border-radius: 30px; letter-spacing: 0.15em;
    margin-bottom: 28px; display: inline-block;
  }
  .cover-main {
    font-size: 5.5rem; font-weight: 900; color: #FF9800;
    text-shadow: 0 6px 30px rgba(255,152,0,0.5);
    line-height: 1; margin-bottom: 16px;
  }
  .cover-sub { font-size: 2rem; color: rgba(255,255,255,0.8); margin-bottom: 32px; }
  .cover-verse {
    background: rgba(255,152,0,0.15); border: 2px solid rgba(255,152,0,0.4);
    border-radius: 16px; padding: 20px 40px;
    font-size: 1.4rem; color: #FFD180; line-height: 1.7;
    max-width: 700px;
  }
  .cover-keys {
    margin-top: 32px; color: rgba(255,255,255,0.4); font-size: 1rem;
  }

  /* INTRO */
  .s-intro {
    flex-direction: column; align-items: flex-start;
    padding: 50px 80px;
    background: linear-gradient(160deg, #2a1300 0%, #150900 100%);
  }
  .act-number {
    font-size: 0.95rem; font-weight: 700; color: #FF9800; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .act-title {
    font-size: 3.4rem; font-weight: 900; color: #fff;
    line-height: 1.1; margin-bottom: 24px;
  }
  .act-title span { color: #FF9800; }
  .act-verse {
    background: rgba(255,152,0,0.12); border-left: 5px solid #FF9800;
    border-radius: 0 12px 12px 0; padding: 18px 28px;
    font-size: 1.3rem; color: #FFD180; line-height: 1.8;
    margin-bottom: 28px; max-width: 780px;
  }
  .act-message {
    font-size: 1.4rem; color: rgba(255,255,255,0.85); line-height: 1.8;
    max-width: 780px;
  }
  .act-message strong { color: #FF9800; }

  /* MATERIALS */
  .s-mat {
    flex-direction: column; align-items: flex-start;
    padding: 40px 80px;
    background: #150900;
  }
  .section-label {
    font-size: 1rem; font-weight: 700; color: #FF9800;
    letter-spacing: 0.2em; margin-bottom: 20px;
  }
  .section-title {
    font-size: 2.4rem; font-weight: 900; color: #fff;
    margin-bottom: 36px;
  }
  .mat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px; width: 100%;
  }
  .mat-grid.col3 { grid-template-columns: repeat(3, 1fr); }
  .mat-grid.col5 { grid-template-columns: repeat(5, 1fr); }
  .mat-item {
    background: rgba(255,152,0,0.1);
    border: 2px solid rgba(255,152,0,0.3);
    border-radius: 18px; padding: 24px 16px;
    text-align: center;
  }
  .mat-item .mat-icon { font-size: 3rem; margin-bottom: 12px; }
  .mat-item .mat-name { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .mat-item .mat-note { font-size: 0.9rem; color: rgba(255,255,255,0.5); }
  .teacher-tip {
    margin-top: 28px;
    background: rgba(255,200,0,0.1); border: 2px solid rgba(255,200,0,0.3);
    border-radius: 12px; padding: 16px 24px;
    font-size: 1.1rem; color: #FFD180; width: 100%;
  }
  .teacher-tip::before { content: "👩‍🏫 선생님 TIP  "; font-weight: 700; }

  /* INFOGRAPHIC */
  .s-infographic {
    flex-direction: column; align-items: flex-start;
    padding: 36px 80px;
    background: #120800;
  }
  .info-flow {
    display: flex; align-items: stretch; gap: 10px;
    width: 100%; margin-top: 12px;
  }
  .info-step {
    flex: 1; background: rgba(255,152,0,0.1);
    border: 2px solid rgba(255,152,0,0.35);
    border-radius: 16px; padding: 22px 16px;
    text-align: center; display: flex; flex-direction: column; align-items: center;
  }
  .info-step .step-num {
    width: 36px; height: 36px; border-radius: 50%;
    background: #FF9800; color: #000; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; margin-bottom: 12px;
  }
  .info-step .step-icon { font-size: 2.4rem; margin-bottom: 10px; }
  .info-step .step-label { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .info-step .step-note { font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.4; }
  .info-arrow {
    display: flex; align-items: center; color: #FF9800;
    font-size: 1.8rem; flex-shrink: 0;
  }
  .svg-banner {
    width: 100%; margin-top: 20px;
    border-radius: 14px; overflow: hidden;
  }

  /* FULL IMAGE */
  .s-imgfull {
    background: #0e0700;
    padding: 24px;
    flex-direction: column;
    gap: 16px;
  }
  .imgfull-label {
    font-size: 1rem; font-weight: 700; color: #FF9800;
    letter-spacing: 0.15em;
  }
  .imgfull-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%;
  }
  .imgfull-wrap img {
    max-width: 90%; max-height: 72vh;
    border-radius: 20px;
    box-shadow: 0 12px 60px rgba(0,0,0,0.6);
    object-fit: contain;
  }

  /* APPLY */
  .s-apply {
    flex-direction: column; align-items: flex-start;
    padding: 48px 80px;
    background: linear-gradient(160deg, #1e0e00 0%, #0e0700 100%);
  }
  .apply-qs { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 18px; }
  .apply-q {
    background: rgba(255,152,0,0.1); border-left: 5px solid #FF9800;
    border-radius: 0 14px 14px 0; padding: 20px 28px;
    font-size: 1.3rem; color: #fff; line-height: 1.6;
  }
  .apply-q .q-label { font-size: 0.9rem; color: #FF9800; font-weight: 700; margin-bottom: 8px; }
  .prayer-box {
    width: 100%; margin-top: 28px;
    background: rgba(255,152,0,0.08); border: 2px solid rgba(255,152,0,0.3);
    border-radius: 16px; padding: 24px 32px;
    font-size: 1.25rem; color: #FFD180; line-height: 2;
    text-align: center;
  }
  .prayer-box .prayer-title { font-size: 1rem; color: #FF9800; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 12px; }

  /* FINALE */
  .s-finale {
    flex-direction: column; text-align: center; align-items: center;
    background: radial-gradient(ellipse at center, #3d1f00 0%, #0e0700 70%);
    padding: 40px;
  }
  .finale-icon { font-size: 5rem; margin-bottom: 24px; }
  .finale-title { font-size: 3rem; font-weight: 900; color: #FF9800; margin-bottom: 16px; }
  .finale-verse {
    font-size: 1.5rem; color: rgba(255,255,255,0.8); line-height: 1.8;
    margin-bottom: 32px; max-width: 700px;
  }
  .finale-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%;
    max-width: 800px;
  }
  .finale-item {
    background: rgba(255,152,0,0.12); border: 2px solid rgba(255,152,0,0.3);
    border-radius: 14px; padding: 20px 16px; text-align: center;
  }
  .finale-item .fi-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .finale-item .fi-text { font-size: 1.05rem; color: #fff; font-weight: 600; }

  /* NAV BUTTONS */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(255,152,0,0.2); border: 2px solid rgba(255,152,0,0.4);
    color: #FF9800; border-radius: 50%; width: 52px; height: 52px;
    font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; z-index: 10;
  }
  .nav-btn:hover { background: rgba(255,152,0,0.4); }
  .nav-btn.left { left: 16px; }
  .nav-btn.right { right: 16px; }
  .nav-btn:disabled { opacity: 0.2; cursor: default; }
  .fullscreen-btn {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6); border-radius: 8px;
    padding: 8px 16px; cursor: pointer; font-size: 0.85rem;
    transition: all 0.2s; z-index: 10;
  }
  .fullscreen-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
  .controls { display:flex; align-items:center; justify-content:center; gap:24px; padding:14px; flex-shrink:0; background:rgba(0,0,0,.4); }
  .btn { padding:13px 40px; border:none; border-radius:30px; font-size:1.05rem; font-weight:700; font-family:inherit; cursor:pointer; transition:all .2s; }
  .btn-prev { background:rgba(255,255,255,.1); color:#fff; }
  .btn-prev:hover { background:rgba(255,255,255,.2); }
  .btn-next { background:#FF9800; color:#1a0f00; }
  .btn-next:hover { background:#ffad33; transform:scale(1.05); }
  .btn:disabled { opacity:.3; cursor:not-allowed; transform:none !important; }
  .key-hint { font-size:.85rem; color:rgba(255,255,255,.3); }
  .nav-btn { display:none; }
  .step-cards { display:flex; gap:14px; width:100%; align-items:stretch; flex:1; }
  .step-card {
    flex:1; text-align:center; padding:20px 10px; border-radius:22px;
    border:2px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:all .35s cubic-bezier(.4,0,.2,1);
    opacity:.28; transform:scale(.88);
  }
  .step-card.done { opacity:.52; transform:scale(.94); border-color:rgba(255,152,0,.35); background:rgba(255,152,0,.09); }
  .step-card.active { opacity:1; transform:scale(1.06); border-color:#FF9800; background:rgba(255,152,0,.22); box-shadow:0 0 34px rgba(255,152,0,.28); }
  .sc-num { width:34px;height:34px; border-radius:50%; background:rgba(255,255,255,.12); display:flex;align-items:center;justify-content:center; font-size:.95rem; font-weight:900; flex-shrink:0; }
  .step-card.active .sc-num { background:#FF9800; color:#000; }
  .step-card.done .sc-num { background:rgba(255,152,0,.4); }
  .sc-icon { display:flex; align-items:center; justify-content:center; width:100%; height:52px; transition:transform .35s; }
  .sc-icon svg { width:90%; max-height:52px; }
  .step-card.active .sc-icon { transform:scale(1.12); height:58px; }
  .sc-label { font-size:.95rem; font-weight:700; color:rgba(255,255,255,.45); transition:all .35s; }
  .step-card.active .sc-label { color:#fff; font-size:1.1rem; }
  .sc-note { font-size:.78rem; color:rgba(255,255,255,.25); line-height:1.4; transition:color .35s; }
  .step-card.active .sc-note { color:rgba(255,255,255,.72); }
  .step-card.done .sc-label { color:rgba(255,255,255,.6); }
  .step-card.done .sc-note { color:rgba(255,255,255,.4); }
  .step-hint { font-size:.82rem; color:rgba(255,255,255,.28); text-align:center; margin-top:8px; letter-spacing:.05em; }
  .s-infographic.has-photo .step-cards { flex:0 0 250px; }
  .activity-photo { width:min(570px,100%); height:clamp(190px,34vh,380px); margin:14px auto 0; overflow:hidden; border:1px solid rgba(255,255,255,.18); border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.28); background:rgba(0,0,0,.24); cursor:zoom-in; }
  .activity-photo img { width:100%; height:100%; display:block; object-fit:contain; object-position:center; }
  .photo-lightbox { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:48px; background:rgba(0,0,0,.88); cursor:zoom-out; }
  .photo-lightbox.open { display:flex; }
  .photo-lightbox img { max-width:92vw; max-height:86vh; object-fit:contain; border-radius:18px; box-shadow:0 20px 70px rgba(0,0,0,.65); }
  .photo-lightbox button { position:absolute; top:20px; right:28px; border:1px solid rgba(255,255,255,.45); border-radius:50%; width:42px; height:42px; color:#fff; background:rgba(0,0,0,.32); font-size:1.5rem; cursor:pointer; }
.s-infographic.has-step-gallery { display:grid; grid-template-columns:minmax(250px,300px) minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto; column-gap:28px; row-gap:10px; align-items:stretch; }
  .has-step-gallery .section-label, .has-step-gallery .section-title { grid-column:1/-1; }
  .has-step-gallery .section-label { margin-bottom:-12px; }
  .has-step-gallery .step-cards { grid-column:1; grid-row:3; flex:1; flex-direction:column; gap:10px; min-height:0; }
  .has-step-gallery .step-card { min-height:0; padding:10px 14px; display:grid; grid-template-columns:34px 46px minmax(0,1fr); grid-template-rows:1fr 1fr; align-items:center; column-gap:8px; text-align:left; transform:none; cursor:pointer; }
  .has-step-gallery .step-card.active { transform:none; }
  .has-step-gallery .sc-num { grid-row:1/3; }
  .has-step-gallery .sc-icon { grid-row:1/3; width:46px; height:46px; }
  .has-step-gallery .sc-icon svg { width:100%; max-height:46px; }
  .has-step-gallery .sc-label { align-self:end; font-size:.92rem; }
  .has-step-gallery .step-card.active .sc-label { font-size:1rem; }
  .has-step-gallery .sc-note { align-self:start; }
  .has-step-gallery .step-hint { grid-column:1/-1; grid-row:4; margin-top:0; }
  .step-detail { grid-column:2; grid-row:3; min-width:0; min-height:0; display:flex; flex-direction:column; gap:12px; padding:18px; overflow:hidden; border:1px solid rgba(255,255,255,.14); border-radius:22px; background:rgba(255,255,255,.04); box-shadow:0 10px 34px rgba(0,0,0,.18); }
  .step-detail-head { display:flex; align-items:baseline; gap:10px; }
  .step-detail-num { color:#FF9800; font-weight:900; font-size:1rem; }
  .step-detail-title { color:#fff; font-size:1.55rem; font-weight:900; }
  .step-detail-photo { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:15px; background:rgba(0,0,0,.25); }
  .step-detail-photo img { width:100%; height:100%; object-fit:contain; cursor:zoom-in; }
  .step-detail-note { color:rgba(255,255,255,.68); font-size:1.05rem; line-height:1.5; text-align:center; }
  .act-jumps { display: flex; gap: 8px; }
  .act-jump { background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.65); border-radius: 20px; padding: 5px 16px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: all 0.2s; white-space: nowrap; }
  .act-jump:hover { background: rgba(255,152,0,0.25); border-color: #FF9800; color: #fff; }
  .act-jump.on { background: rgba(255,152,0,0.25); border-color: #FF9800; color: #fff; font-weight: 700; }
  @media (max-width: 768px) {
    /* NAV */
    .top-nav { padding:8px 12px; gap:6px; flex-wrap:wrap; }
    .brand-lockup { display:none; }
    .nav-title { font-size:.95rem; }
    .act-jumps { gap:4px; order:10; width:100%; justify-content:center; }
    .act-jump { padding:4px 10px; font-size:.72rem; }
    .progress-wrap, .progress-dots, .slide-counter, .journey-mascot, .key-hint, .fullscreen-btn { display:none !important; }
    .nav-btn { width:36px; font-size:1.5rem; }
    /* SLIDES — allow scroll for content-heavy slides */
    .slide { overflow-y:auto; }
    /* COVER */
    .s-cover { padding:24px 20px !important; }
    .cover-main { font-size:2.8rem; }
    .cover-sub { font-size:1.1rem; }
    .cover-verse { font-size:.95rem; padding:12px 18px; }
    .cover-badge { font-size:.85rem; padding:6px 18px; }
    .cover-keys { display:none; }
    /* INTRO */
    .s-intro { padding:18px 20px !important; }
    .act-number { font-size:.85rem; }
    .act-title { font-size:1.9rem; }
    .act-verse { font-size:.95rem; padding:12px 16px; }
    .act-message { font-size:.95rem; }
    /* MATERIALS */
    .s-mat { padding:18px 20px !important; }
    .section-title { font-size:1.6rem; margin-bottom:14px; }
    .mat-grid { grid-template-columns:1fr 1fr !important; gap:10px; }
    .mat-grid.col5 { grid-template-columns:repeat(3,1fr) !important; }
    .mat-item { padding:12px 8px; }
    .mat-item .mat-icon { font-size:1.9rem; margin-bottom:6px; }
    .mat-item .mat-name { font-size:1rem; }
    .mat-item .mat-note { font-size:.82rem; }
    /* STEP GALLERY — food-tour has section-label + section-title = 2 extra rows */
    .s-infographic.has-step-gallery {
      inset:0 !important;
      grid-template-columns:1fr !important;
      grid-template-rows:auto auto auto 1fr auto !important;
      padding:12px 14px 8px !important;
      overflow:hidden !important;
    }
    .has-step-gallery .section-label { grid-column:1 !important; grid-row:1 !important; margin-bottom:0; }
    .has-step-gallery .section-title { grid-column:1 !important; grid-row:2 !important; font-size:1.5rem; margin-bottom:6px; }
    .has-step-gallery .step-cards {
      grid-column:1 !important; grid-row:3 !important;
      flex-direction:row !important; overflow-x:auto;
      gap:8px; height:100px; max-height:100px;
      padding-bottom:4px; min-height:0; flex-shrink:0;
    }
    .has-step-gallery .step-card {
      min-width:84px; max-width:84px; flex-shrink:0;
      display:flex !important; flex-direction:column !important;
      align-items:center; text-align:center; padding:6px 4px;
    }
    .has-step-gallery .sc-num { grid-row:unset; width:28px; height:28px; font-size:.8rem; }
    .has-step-gallery .sc-icon { grid-row:unset; width:30px; height:30px; }
    .has-step-gallery .sc-icon svg { max-height:30px; }
    .has-step-gallery .sc-label { font-size:.72rem; }
    .has-step-gallery .sc-note { display:none; }
    .has-step-gallery .step-detail {
      grid-column:1 !important; grid-row:4 !important;
      min-height:0; overflow:hidden; padding:12px !important;
      display:flex; flex-direction:column; gap:8px;
    }
    .has-step-gallery .step-hint { grid-column:1 !important; grid-row:5 !important; font-size:.75rem; }
    .step-detail-title { font-size:1.15rem; }
    .step-detail-photo { flex:1; min-height:0; }
    .step-detail-note { font-size:.9rem; }
    .has-step-gallery .step-progress { display:none !important; }
    /* CONTROLS */
    .controls { padding:8px 12px; gap:10px; }
    .btn { padding:9px 20px; font-size:.9rem; }
  }
</style>
<link rel="stylesheet" href="theme-night-garden.css">
</head>
<body>
<div class="journey-mascot" aria-hidden="true"><span>⌣</span></div>

<div class="top-nav">
  <div class="brand-lockup"><img class="tour-brand-logo" src="img/brand/bible-tour-logo.png" alt="BIBLE TOUR His Story"></div>
  <a class="nav-home" href="index.html">← 홈</a>
  <div class="nav-title">🍽️ 미식투어</div>
  <div class="act-jumps">
    <button class="act-jump on" onclick="goTo(1)" id="aj1">① 포도주</button>
    <button class="act-jump" onclick="goTo(6)" id="aj2">② 라이스케이크</button>
    <button class="act-jump" onclick="goTo(11)" id="aj3">③ 빈무덤</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-dots" id="dots"></div>
    <div class="slide-counter" id="counter"></div>
  </div>
</div>

let cur = 0;
const area = document.getElementById('slideArea');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');

// Build slides
slides.forEach((s, i) => {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = s.html.trim();
  const el = wrapper.firstElementChild;
  el.id = 's' + i;
  if (i !== 0) { el.classList.remove('active'); }
  else { el.classList.add('active'); }
  area.appendChild(el);
});

// Build dots
slides.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => goTo(i);
  dotsEl.appendChild(d);
});

function updateUI() {
  const dots = dotsEl.querySelectorAll('.dot');
  dots.forEach((d, i) => {
    d.className = 'dot' + (i === cur ? ' active' : i < cur ? ' done' : '');
  });
  counterEl.textContent = (cur + 1) + ' / ' + slides.length;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = false;
  document.getElementById('btnPrevBottom').disabled = cur === 0;
  document.getElementById('btnNextBottom').disabled = false;
  const a = cur >= 11 ? 'aj3' : cur >= 6 ? 'aj2' : 'aj1';
  ['aj1','aj2','aj3'].forEach(id => { const b = document.getElementById(id); if(b) b.className = 'act-jump' + (id === a ? ' on' : ''); });
  updateDetail(document.getElementById('s' + cur), subStep);
}

let subStep = 0;
function updateCards(s){
  const sl = document.getElementById('s' + cur);
  if(!sl) return;
  [...sl.querySelectorAll('.step-card')].forEach((c,i)=>{
    c.className='step-card'+(i===s?' active':i<s?' done':'');
  });
  const activeCard=sl.querySelector('.step-card.active');
  if(activeCard)activeCard.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  updateDetail(sl,s);
}
function updateDetail(sl,s){
  if(!sl)return;
  const detail=sl.querySelector('.step-detail');if(!detail)return;
  const card=sl.querySelectorAll('.step-card')[s];if(!card)return;
  const title=card.querySelector('.sc-label')?.innerText||'';
  const note=card.querySelector('.sc-note')?.innerText.replace(/\n/g,' ')||'';
  const count=sl.querySelectorAll('.step-card').length;
  let progress=detail.querySelector('.step-progress');
  if(!progress){ progress=document.createElement('div'); progress.className='step-progress'; detail.querySelector('.step-detail-head').insertAdjacentElement('afterend',progress); }
  progress.innerHTML=[...Array(count)].map((_,i)=>`<span class="step-progress-dot ${i===s?'active':i<s?'done':''}"></span>`).join('');
  detail.querySelector('.step-detail-num').textContent=String(s+1).padStart(2,'0');
  detail.querySelector('.step-detail-title').textContent=title;
  detail.querySelector('.step-detail-note').textContent=note;
  const img=detail.querySelector('.step-detail-img');img.src=`img/activity/steps/${sl.dataset.gallery}-${s+1}.png`;img.alt=`${title} 활동 사진`;
}
function goTo(n) {
  if (n >= slides.length) { location.href = 'index.html'; return; }
  // handle sub-steps on infographic slides
  const sl = document.getElementById('s' + cur);
  if(sl) {
    const cards = sl.querySelectorAll('.step-card');
    if(cards.length > 0) {
      if(n > cur && subStep < cards.length - 1) { subStep++; updateCards(subStep); return; }
      if(n < cur && subStep > 0) { subStep--; updateCards(subStep); return; }
    }
  }
  const prev = cur;
  cur = Math.max(0, Math.min(slides.length - 1, n));
  if (prev === cur) return;
  const prevEl = document.getElementById('s' + prev);
  const curEl  = document.getElementById('s' + cur);
  prevEl.classList.remove('active');
  prevEl.classList.add(n > prev ? 'prev' : '');
  if (n <= prev) prevEl.classList.remove('prev');
  curEl.classList.remove('prev');
  curEl.classList.add('active');
  subStep = 0;
  // init first card of new slide
  setTimeout(()=>{ const newSl=document.getElementById('s'+cur); if(newSl&&newSl.querySelectorAll('.step-card').length>0) updateCards(0); }, 50);
  updateUI();
}

function go(d) { goTo(cur + d); }

document.addEventListener('keydown', e => {
  if (e.key === '1') goTo(1);
  if (e.key === '2') goTo(6);
  if (e.key === '3') goTo(11);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
  if (e.key === 'f' || e.key === 'F') toggleFS();
});
document.addEventListener('click', e => { const card=e.target.closest('.has-step-gallery .step-card'); if(!card)return; const sl=card.closest('.slide'); if(!sl?.classList.contains('active'))return; subStep=[...sl.querySelectorAll('.step-card')].indexOf(card); updateCards(subStep); });

function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

const lightbox = document.createElement('div');
lightbox.className = 'photo-lightbox';
lightbox.innerHTML = '<button type="button" aria-label="사진 닫기">×</button><img alt="확대된 활동 사진">';
document.body.appendChild(lightbox);
const lightboxImg = lightbox.querySelector('img');
document.addEventListener('click', e => {
  const img = e.target.closest('.activity-photo img, .step-detail-photo img');
  if (img) { lightboxImg.src = img.src; lightboxImg.alt = img.alt; lightbox.classList.add('open'); }
  else if (e.target === lightbox || e.target.closest('.photo-lightbox button')) lightbox.classList.remove('open');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

updateUI();
let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-_tx;if(Math.abs(dx)>50){go(dx<0?1:-1);}});
</script>
</body>
</html>
